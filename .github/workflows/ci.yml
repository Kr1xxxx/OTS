name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Node the released app bundles (see release.yml); tests run on the same one.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      # 每个 UI 测试各开一个 Chromium，4 个并发在 CI 机器上会把计时类断言挤超时（每次挂的测试都不一样）；减到 2 个并发，测试一个不少。
      - run: npm test
        env:
          OTS_TEST_CONCURRENCY: 2

  # The app's engine. Every test that opens a browser runs once more in Playwright's WebKit on macOS
  # (WebKit's Mac port) instead of Chromium. It is not the app's window: see scripts/helpers/use-webkit.js.
  test-webkit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm test
        env:
          OTS_TEST_BROWSER: webkit
          OTS_TEST_CONCURRENCY: 2

  test-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Node the released app bundles (see release.yml); tests run on the same one.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: python3 -m pip install --break-system-packages Pillow
      - name: Build app (ad-hoc signed, not installed)
        run: ./mac-app/build-native-mac-app.sh
      # The only check that runs the real window (Swift host + WKWebView); everything in npm test uses Chromium.
      - name: Built app starts and its page reports in (real WKWebView)
        run: node scripts/smoke-test-real-app.js --app mac-app/TradeOrderSystem.app
      # 每个 UI 测试各开一个 Chromium，4 个并发在 CI 机器上会把计时类断言挤超时（每次挂的测试都不一样）；减到 2 个并发，测试一个不少。
      - run: npm test
        env:
          OTS_TEST_CONCURRENCY: 2
      - run: node scripts/check-release.js --app mac-app/TradeOrderSystem.app
      - name: Small update package rebuilds the same app
        run: ./scripts/package-mac-release.sh mac-app/TradeOrderSystem.app "$RUNNER_TEMP/dist" "$(cat VERSION)"
