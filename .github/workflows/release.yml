name: Release

# Publishes the Mac app to GitHub Releases. The in-app updater reads releases/latest from this repo,
# so every release reaches every user within minutes. Gates, in order:
# 1. CI passed for this exact commit on main (the release used to run in parallel with CI and
#    shipped several versions whose CI had failed);
# 2. there is something to publish: notes waiting in release-notes/next/ (the workflow then takes
#    the next version number and commits it to main), or a VERSION that has no release yet;
# 3. the packaged app's own Node starts its server.js, /api/health passes and the page loads, and
#    the app itself opens and its page reports in.
#
# Pull requests do not carry version numbers: two of them open at once used to claim the same one.
# scripts/prepare-release.js has the rules; release-notes/next/README.md says what a PR adds.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    # 只从 main 发版；CI 失败、或是 PR 触发的 CI，一律不发。
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Require a green CI run for this commit
        # 手动触发时也要求这个提交的 CI 已经通过。发版流程自己提交的「Release V…」只改版本号和更新说明，
        # 它没有 CI 记录（机器人的推送不触发 CI），看它的上一个提交。
        run: |
          CHECK="$SHA"
          if git log -1 --format='%an|%s' "$SHA" | grep -Eq '^github-actions\[bot\]\|Release V[0-9]+\.[0-9]+$'; then
            CHECK="$(git rev-parse "$SHA^")"
          fi
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CHECK&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // ""')"
          echo "CI for $CHECK: ${CONCLUSION:-none}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI has not passed for $CHECK; not publishing."
            exit 1
          fi
      - name: Decide the version and commit it
        id: version
        run: |
          CURRENT="$(tr -d '[:space:]' < VERSION)"
          # "Not released" has to be GitHub answering 404, not a request that failed: a wrong "no"
          # would fold the waiting notes into a version users already have.
          if RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$CURRENT" --jq .tag_name 2>&1)"; then RELEASED=yes
          elif printf '%s' "$RELEASE" | grep -q 'HTTP 404'; then RELEASED=no
          else
            echo "::error::Could not find out whether v$CURRENT is released: $RELEASE"
            exit 1
          fi
          PLAN="$(node scripts/prepare-release.js --released "$RELEASED")"
          echo "V$CURRENT released: $RELEASED. Plan: $PLAN"
          VERSION="$(node -p 'JSON.parse(process.argv[1]).version' "$PLAN")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(node -p 'JSON.parse(process.argv[1]).publish' "$PLAN")" != "true" ]; then
            echo "Nothing to publish: V$CURRENT is released and release-notes/next/ is empty."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(node -p 'JSON.parse(process.argv[1]).changed' "$PLAN")" != "true" ]; then
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The version commit goes on top of the commit CI tested, and only while that is still
          # the tip of main. If main has moved on, the CI run of the newer commit releases instead
          # (the notes are still waiting there).
          tip() { git ls-remote origin refs/heads/main | cut -f1; }
          if [ "$(tip)" != "$SHA" ]; then
            echo "main has moved on from $SHA; the CI run of the newer commit will release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/check-project.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release V$VERSION"
          if ! git push origin HEAD:refs/heads/main; then
            if [ "$(tip)" != "$SHA" ]; then
              echo "main moved while the release was being prepared; the CI run of the newer commit will release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not push the version commit to main."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  mac:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          # Pinned in .node-version: this Node is copied into the app as node-runtime. While it stays
          # the same, in-app updates download only the ~2 MB -lite.zip; a new Node means one ~39 MB update.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Native core tests (version compare, update policy)
        run: npm run test:native
      - name: Build app (ad-hoc signed)
        run: ./mac-app/build-native-mac-app.sh
      - name: Package zips (updater, full + small) and dmg (first install)
        run: ./scripts/package-mac-release.sh mac-app/TradeOrderSystem.app dist "$VERSION" --dmg
      - name: Smoke test the packaged app (from the zip users download)
        run: |
          ARCH="$(uname -m)"
          rm -rf smoke && mkdir smoke
          ditto -x -k "dist/TradeOrderSystem-$VERSION-mac-$ARCH.zip" smoke
          codesign --verify --deep --strict smoke/TradeOrderSystem.app
          node scripts/smoke-test-app-bundle.js --app smoke/TradeOrderSystem.app
          node scripts/smoke-test-real-app.js --app smoke/TradeOrderSystem.app
      - name: Publish release
        # The notes are what the app shows before installing; without a notes file (a version
        # bumped by hand) GitHub's generated list of pull requests is used.
        run: |
          NOTES=(--generate-notes)
          if [ -s "release-notes/v$VERSION.md" ]; then NOTES=(--notes-file "release-notes/v$VERSION.md"); fi
          gh release create "v$VERSION" dist/* \
            --target "${{ needs.gate.outputs.sha }}" \
            --title "OTS V$VERSION" \
            "${NOTES[@]}"
