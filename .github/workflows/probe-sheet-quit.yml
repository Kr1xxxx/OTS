# Temporary experiment, removed before merge.
name: Probe sheet quit
on:
  pull_request:
  push:
    branches: [claude/project-thread-3agv9w]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O scripts/probe/sheet-quit-probe.swift -o "$RUNNER_TEMP/probe"
      - name: Run each mode with an 8 s limit
        run: |
          for mode in nosheet sheet endsheet; do
            echo "=== $mode"
            "$RUNNER_TEMP/probe" "$mode" & pid=$!
            for i in $(seq 1 80); do kill -0 $pid 2>/dev/null || break; sleep 0.1; done
            if kill -0 $pid 2>/dev/null; then echo "RESULT $mode: STILL RUNNING after 8 s"; kill -9 $pid; else wait $pid; echo "RESULT $mode: exited ($?)"; fi
          done
